<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><path d='M12 2L2 22h20L12 2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prism — Performance Refracted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@200;300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('prism_theme');
          var cl = document.documentElement.classList;
          var isLight = t === 'light';
          if (isLight) { cl.add('prism-light', 'light'); cl.remove('prism-dark', 'dark'); }
          else          { cl.add('prism-dark', 'dark');   cl.remove('prism-light', 'light'); }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isLight ? '#f2f0eb' : '#050505');
        } catch(e) {
          document.documentElement.classList.add('prism-dark', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#050505] text-slate-100 font-outfit antialiased selection:bg-sky-500 selection:text-white transition-colors duration-300 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
